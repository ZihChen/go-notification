# SSE 服務 HPA 配置
# 特性：長連接服務，需要穩定的擴縮容策略
# 擴容：基於連接數和資源使用率，min=3, max=10
# 閾值：CPU 70%（比 Web 服務更寬鬆）
# 穩健擴容：120秒穩定期，避免頻繁擴容導致連接重分配
# 極慢縮容：10分鐘穩定期，每次最多縮5%，保護現有長連接

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "fatnotificationcat.fullname" . }}-sse
  labels:
    {{- include "fatnotificationcat.labels" . | nindent 4 }}
    app.kubernetes.io/component: sse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "fatnotificationcat.fullname" . }}-sse
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120  # 2分鐘穩定期，避免頻繁擴容
      policies:
      - type: Percent
        value: 50  # 每次最多擴容50%
        periodSeconds: 120
      - type: Pods
        value: 2  # 或每次最多增加2個Pod
        periodSeconds: 120
      selectPolicy: Min  # 選擇最保守的策略
    scaleDown:
      stabilizationWindowSeconds: 600  # 10分鐘穩定期，保護長連接
      policies:
      - type: Percent
        value: 5  # 每次最多縮容5%，非常保守
        periodSeconds: 120
      - type: Pods
        value: 1  # 或每次最多減少1個Pod
        periodSeconds: 120
      selectPolicy: Min  # 選擇最保守的策略
