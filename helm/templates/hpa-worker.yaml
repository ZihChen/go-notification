# 穩定處理：min=3, max=5
# 保守閾值：CPU 70%, Memory 80%
# 穩定擴容：2分鐘穩定期，每次最多+1個Pod
# 長縮容期：8分鐘穩定期，避免任務中斷

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "fatnotificationcat.fullname" . }}-worker
  labels:
    {{- include "fatnotificationcat.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "fatnotificationcat.fullname" . }}-worker
  minReplicas: 5
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
      - type: Pods
        value: 1
        periodSeconds: 120
    scaleDown:
      stabilizationWindowSeconds: 480
      policies:
      - type: Pods
        value: 1
        periodSeconds: 180