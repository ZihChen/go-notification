global:
  environment: production

env:
  # 應用程序設置
  APP_NAME: "fat-notification-cat"
  APP_ENV: "development"
  APP_PORT: "8080"
  APP_DEBUG: "true"

  # HTTP Server 設置
  SERVER_HTTP_DOMAIN: "fatnotificationcat-internal.micromicro.work"
  SERVER_READ_TIMEOUT: "30s"
  SERVER_WRITE_TIMEOUT: "30s"
  SERVER_IDLE_TIMEOUT: "120s"

  # 資料庫設置
  DB_HOST: "REDACTED_DB_HOST"
  DB_PORT: "3306"
  DB_USER: "a9jasrk3rl9ehqfzsn1k"
  # DB_PASSWORD: <secret>
  DB_NAME: "ms_fatnotificationcat_pro"

  # Atlas 測試資料庫設置
  ATLAS_DEV_USER: "REDACTED_DB_USER_DEV"
  # ATLAS_DEV_PASSWORD: <secret>

  # 資料庫連線池設置
  DB_MAX_IDLE: "25"
  DB_MAX_OPEN: "100"
  DB_MAX_LIFETIME: "1h"
  DB_MAX_IDLE_TIME: "30m"

  # Redis設置
  REDIS_DOMAIN: "fatnotificationcat-redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"

  # Redis Pool 設置
  REDIS_POOL_SIZE: "20"
  REDIS_MIN_IDLE_CONNS: "5"
  REDIS_MAX_RETRIES: "3"
  REDIS_DIAL_TIMEOUT: "5s"
  REDIS_READ_TIMEOUT: "3s"
  REDIS_WRITE_TIMEOUT: "3s"
  REDIS_POOL_TIMEOUT: "4s"
  REDIS_IDLE_TIMEOUT: "5m"
  REDIS_MAX_CONN_AGE: "30m"

  # AWS KDS設置
  AWS_REGION: "ap-northeast-1"

  # Producer 發送事件用
  KINESIS_STREAM_NAME: "fatcat-extension-fat-identity-cat-pro-kds-stream"
  KINESIS_STREAM_ARN: "arn:aws:kinesis:ap-northeast-1:416777209679:stream/fatcat-extension-fat-identity-cat-pro-kds-stream"
  DYNAMODB_TABLE: "fat-notification-cat"
  DYNAMODB_PARTITION_KEY: "partition_key"

  # OpenObserve設置
  OPENOBSERVE_TRACE_API_ENDPOINT: "https://watchdog-ob.panpancat.click/api/jvd-prod/traces"
  # OPENOBSERVE_TRACE_API_KEY: <secret>
  OPENOBSERVE_TRACE_STREAM_NAME: "fat_notification_cat"

  # OpenObserve logs設置
  OPENOBSERVE_LOGS_API_ENDPOINT: "https://watchdog-ob.panpancat.click/api/jvd-prod/default/_json"
  OPENOBSERVE_LOGS_USERNAME: "REDACTED_OO_USERNAME"
  # OPENOBSERVE_LOGS_PASSWORD: <secret>

  # KDS Events
  EVENT_IDENTITY_MERCHANT_SYNC: "tw.jvd.fatidentitycat.merchant.sync.v1"
  EVENT_IDENTITY_PLAYER_SYNC: "tw.jvd.fatidentitycat.player.sync.v1"
  EVENT_IDENTITY_MANAGER_SYNC: "tw.jvd.fatidentitycat.manager.sync.v1"
  EVENT_IDENTITY_TAG_SYNC: "tw.jvd.fatidentitycat.tag.sync.v1"
  EVENT_IDENTITY_PLAYER_LEVEL_SYNC: "tw.jvd.fatidentitycat.playerlevel.sync.v"
  EVENT_IDENTITY_PLAYER_TAGS_SYNC: "tw.jvd.fatidentitycat.playertags.sync.v1"
  EVENT_IDENTITY_AGENT_SYNC: "tw.jvd.fatidentitycat.agent.sync.v1"


encryptedEnv:
  DB_PASSWORD: 
  OPENOBSERVE_TRACE_API_KEY: 
  OPENOBSERVE_LOGS_PASSWORD: 
# Application settings
app:
  name: fatnotificationcat
  appName: fatnotificationcat
  image:
    repository: 416777209679.dkr.ecr.ap-northeast-1.amazonaws.com/fatcat-extension/fat-notification-cat
    tag: latest
  replicas: 1