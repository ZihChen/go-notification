global:
  environment: production

env:
  # 應用程序設置
  APP_NAME: "fat-notification-cat"
  APP_ENV: "production"
  APP_PORT: "8080"
  APP_DEBUG: "true"

  # HTTP Server 設置
  SERVER_HTTP_DOMAIN: "fatnotificationcat-internal.micromicro.pro"
  SERVER_READ_TIMEOUT: "30s"
  SERVER_WRITE_TIMEOUT: "30s"
  SERVER_IDLE_TIMEOUT: "120s"

  # Metrics 設置
  METRICS_ENABLED: "false"
  METRICS_OTLP_ENABLED: "false"
  METRICS_OTLP_ENDPOINT: "https://o2.jvdev.cc"
  METRICS_OTLP_PATH: "/api/default/v1/metrics"
  METRICS_OTLP_HEADERS: '{"Authorization":"Basic REDACTED_OO_AUTH_B64","stream-name":"fat-notification-cat"}'
  METRICS_OTLP_INSECURE: "false"
  METRICS_OTLP_INTERVAL: "60s"
  METRICS_OTLP_TIMEOUT: "30s"

  # 資料庫設置
  DB_HOST: "REDACTED_DB_HOST"
  DB_PORT: "3306"
  DB_USER: "a9jasrk3rl9ehqfzsn1k"
  # DB_PASSWORD: <secret>
  DB_NAME: "ms_fatnotificationcat_pro"

  # Atlas 測試資料庫設置
  ATLAS_DEV_USER: "REDACTED_DB_USER_DEV"
  # ATLAS_DEV_PASSWORD: <secret>

  # 資料庫連線池設置
  DB_MAX_IDLE: "15"
  DB_MAX_OPEN: "30"
  DB_MAX_LIFETIME: "30m"
  DB_MAX_IDLE_TIME: "15m"

  # Redis設置
  REDIS_DOMAIN: "fatnotificationcat-redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"

  # Redis Pool 設置
  REDIS_POOL_SIZE: "20"
  REDIS_MIN_IDLE_CONNS: "5"
  REDIS_MAX_RETRIES: "3"
  REDIS_DIAL_TIMEOUT: "5s"
  REDIS_READ_TIMEOUT: "3s"
  REDIS_WRITE_TIMEOUT: "3s"
  REDIS_POOL_TIMEOUT: "4s"
  REDIS_IDLE_TIMEOUT: "5m"
  REDIS_MAX_CONN_AGE: "30m"

  # AWS KDS設置
  AWS_REGION: "ap-northeast-1"

  # Consumer 設置
  CONSUMER_BATCH_SIZE: "300"
  CONSUMER_KDS_RECORD_LIMIT: "2000"
  CONSUMER_WORKER_POOL_SIZE: "15"
  CONSUMER_WORKER_BUFFER_SIZE: "500"
  CONSUMER_MIN_BACKOFF: "500ms"
  CONSUMER_MAX_BACKOFF: "5s"
  CONSUMER_MAX_SHARD_CONCURRENCY: "8"
  CONSUMER_SHARD_LOCK_TIMEOUT: "30s"

  # Producer 發送事件用
  KINESIS_STREAM_NAME: "fatcat-extension-fat-identity-cat-pro-kds-stream"
  KINESIS_STREAM_ARN: "arn:aws:kinesis:ap-northeast-1:416777209679:stream/fatcat-extension-fat-identity-cat-pro-kds-stream"
  DYNAMODB_TABLE: "fat-notification-cat"
  DYNAMODB_PARTITION_KEY: "partition-key"

  # OpenObserve設置
  OPENOBSERVE_TRACE_API_ENDPOINT: "https://watchdog-ob.panpancat.click/api/jvd-prod/traces"
  # OPENOBSERVE_TRACE_API_KEY: <secret>
  OPENOBSERVE_TRACE_STREAM_NAME: "quantumcat"

  # OpenObserve logs設置
  OPENOBSERVE_LOGS_API_ENDPOINT: "https://watchdog-ob.panpancat.click/api/jvd-prod/default/_json"
  OPENOBSERVE_LOGS_USERNAME: "REDACTED_OO_USERNAME"
  # OPENOBSERVE_LOGS_PASSWORD: <secret>

  # KDS Events
  EVENT_IDENTITY_MERCHANT_SYNC: "tw.jvd.fatidentitycat.merchant.sync.v1"
  EVENT_IDENTITY_PLAYER_SYNC: "tw.jvd.fatidentitycat.player.sync.v1"
  EVENT_IDENTITY_MANAGER_SYNC: "tw.jvd.fatidentitycat.manager.sync.v1"
  EVENT_IDENTITY_TAG_SYNC: "tw.jvd.fatidentitycat.tag.sync.v1"
  EVENT_IDENTITY_PLAYER_LEVEL_SYNC: "tw.jvd.fatidentitycat.playerlevel.sync.v1"
  EVENT_IDENTITY_PLAYER_TAGS_SYNC: "tw.jvd.fatidentitycat.playertags.sync.v1"
  EVENT_IDENTITY_AGENT_SYNC: "tw.jvd.fatidentitycat.agent.sync.v1"

  # API AUTH 設置
  AUTH_ENABLED: "true"
  AUTH_HEADER_KEY: "API-Key"
  AUTH_ENCRYPTION_TYPE: "base64"

encryptedEnv:
  DB_PASSWORD: 
  OPENOBSERVE_TRACE_API_KEY: 
  OPENOBSERVE_LOGS_PASSWORD: 
  AUTH_API_KEYS: 

  # JWT 密鑰 (用於驗證前端 SSE 長連接)
  SSE_JWT_SECRET_KEY: 
# Application settings
app:
  name: fatnotificationcat
  appName: fatnotificationcat
  image:
    repository: 416777209679.dkr.ecr.ap-northeast-1.amazonaws.com/fatcat-extension/fat-notification-cat
    tag: latest
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 64Mi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60

consumer:
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 65

worker:
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60

sse:
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

scheduler:
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

redis:
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      memory: 512Mi
