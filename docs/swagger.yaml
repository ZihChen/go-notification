        根據商戶ID獲取會員訊息自動派發設定，返回簡化格式只包含必要欄位

        **回應格式說明：**
        只返回前端需要的核心欄位，已移除 merchant_id、notification_types、target、status、auto_send、real_sent_count 等內部欄位

        **範例回應：**
        ```json
        {
        "global_merchant_id": "merchant-123e4567-e89b-12d3-a456-426614174000",
        "settings": [
        {
        "id": 1,
        "category": "member",
        "item": "registration",
        "trigger_type": "success",
        "title": "註冊成功",
        "content": "恭喜，註冊成功！",
        "active": true,
        "created_at": "2024-10-08T10:30:00+08:00",
        "updated_at": "2024-10-08T11:15:00+08:00"
        },
        {
        "id": 2,
        "category": "member",
        "item": "identity_verification",
        "trigger_type": "success",
        "title": "身分驗證成功",
        "content": "恭喜，身分驗證成功！",
        "active": true,
        "created_at": "2024-10-08T10:30:00+08:00",
        "updated_at": "2024-10-08T11:15:00+08:00"
        },
        {
        "id": 3,
        "category": "member",
        "item": "identity_verification",
        "trigger_type": "failure",
        "title": "身分驗證失敗",
        "content": "抱歉，身分驗證失敗，請重新提交",
        "active": false,
        "created_at": "2024-10-08T10:30:00+08:00",
        "updated_at": "2024-10-08T11:15:00+08:00"
        }
        ]
        }
        ```
      produces:
      - application/json
      responses:
        "200":
          description: 成功獲取自動設定
          schema:
            $ref: '#/definitions/dto.MerchantAutoSettingsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: 獲取商戶自動設定
      tags:
      - 會員訊息自動設定
    post:
      consumes:
      - application/json
      description: |-
        為特定商戶建立或更新會員訊息自動派發設定，支持批量設定多個自動發送規則

        **必需包含所有6種組合：**
        1. member + registration + success (註冊成功)
        2. member + identity_verification + success (實名驗證成功)
        3. member + identity_verification + failure (實名驗證失敗)
        4. member + bank_card + failure (取款方式綁定失敗)
        5. bonus + mission + success (優惠派發成功)
        6. bonus + mission + failure (優惠派發失敗)

        **完整範例：**
        ```json
        {
        "settings": [
        {"category": "member", "item": "registration", "trigger_type": "success", "title": "註冊成功", "content": "恭喜，註冊成功", "active": true},
        {"category": "member", "item": "identity_verification", "trigger_type": "success", "title": "身分驗證成功", "content": "恭喜，身分驗證成功", "active": true},
        {"category": "member", "item": "identity_verification", "trigger_type": "failure", "title": "身分驗證失敗", "content": "抱歉，身分驗證失敗", "active": false},
        {"category": "member", "item": "bank_card", "trigger_type": "failure", "title": "銀行卡綁定失敗", "content": "抱歉，銀行卡綁定失敗", "active": true},
        {"category": "bonus", "item": "mission", "trigger_type": "success", "title": "任務完成", "content": "恭喜，任務完成", "active": true},
        {"category": "bonus", "item": "mission", "trigger_type": "failure", "title": "任務失敗", "content": "抱歉，任務失敗", "active": false}
        ]
        }
        ```

        **參數說明：**
        - settings: 自動設定項目列表，必須包含上述6種組合
        - category: 消息類型，可選值：member(會員消息)、bonus(紅利消息)
        - item: 消息項目，可選值：registration(註冊)、identity_verification(身份驗證)、bank_card(銀行卡)、mission(任務)
        - trigger_type: 觸發類型，可選值：success(成功)、failure(失敗)
        - title: 消息標題，必填，最大255個字符
        - content: 消息內容，必填
        - active: 是否啟用自動發送，必填，設定為false時該項目將不會自動發送通知
      parameters:
      - description: 商戶自動設定請求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.MerchantAutoSettingsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/dto.AutoSettingsOperationResponse'
        "201":
          description: 建立成功
          schema:
            $ref: '#/definitions/dto.AutoSettingsOperationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: 新增或更新商戶自動設定
      tags:
      - 會員訊息自動設定
    put:
      consumes:
      - application/json
      description: |-
