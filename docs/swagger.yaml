definitions:
  handler.CreateMessageCampaignRequest:
    properties:
      auto_send:
        type: boolean
      category:
        maximum: 3
        minimum: 1
        type: integer
      content:
        type: string
      created_by:
        maxLength: 100
        type: string
      focus:
        type: integer
      item:
        maximum: 6
        minimum: 1
        type: integer
      send_end_time:
        type: string
      send_start_time:
        type: string
      title:
        maxLength: 255
        type: string
      total_target_count:
        type: integer
    required:
    - category
    - content
    - created_by
    - focus
    - item
    - title
    type: object
  handler.ErrorResponse:
    properties:
      error:
        example: An error occurred
        type: string
    type: object
  handler.Merchant:
    properties:
      api_key:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      display_name:
        type: string
      global_merchant_id:
        type: string
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
    type: object
  handler.MessageCampaign:
    properties:
      auto_send:
        description: 是否為系統自動訊息
        type: boolean
      category:
        description: 1=member, 2=bonus, 3=others
        type: integer
      content:
        description: 可包含 HTML Tag
        type: string
      created_at:
        type: string
      created_by:
        description: 建立者帳號或名稱
        type: string
      focus:
        description: 1=_in_thirty, 2=_low_activity, 3=_not_activity, 8=_one, 9=_level,
          10=_tag, 11=_all
        type: integer
      id:
        type: integer
      item:
        description: 1=registration, 2=identity_verification, ..., 6=all
        type: integer
      real_sent_count:
        description: 實際成功發送人數
        type: integer
      send_end_time:
        type: string
      send_start_time:
        type: string
      title:
        type: string
      total_target_count:
        description: 預估發送對象總人數
        type: integer
      updated_at:
        type: string
      updated_by:
        description: 最後更新者帳號或名稱
        type: string
    type: object
  handler.SuccessResponse:
    properties:
      status:
        example: success
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@jvdiamondtech.com
    name: API Support
    url: http://www.jvdiamondtech.com/support
  description: 用於管理商戶、玩家和管理員的身份服務
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Notification Service API
  version: "1.0"
paths:
  /api/v1/merchants/{id}:
    get:
      consumes:
      - application/json
      description: 根據商戶ID獲取商戶信息
      parameters:
      - description: 商戶ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Merchant'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: 通過ID獲取商戶
      tags:
      - 商戶
  /api/v1/message-campaigns:
    post:
      consumes:
      - application/json
      description: 創建新的會員訊息活動
      parameters:
      - description: 創建請求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateMessageCampaignRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.MessageCampaign'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: 創建會員訊息活動
      tags:
      - 訊息管理
  /api/v1/messages/player/{global_player_id}/sse:
    get:
      consumes:
      - application/json
      description: 為指定玩家建立SSE連接，即時推送訊息更新
      parameters:
      - description: 全域玩家ID
        in: path
        name: global_player_id
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE stream
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Server-Sent Events訊息推送
      tags:
      - 玩家訊息
  /health:
    get:
      description: 檢查服務是否正常運行
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
      summary: 健康檢查
      tags:
      - 系統
swagger: "2.0"
