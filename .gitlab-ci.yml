stages:
  - lint
  - test
  - build

# 定義一個通用的清理腳本
.cleanup_script: &cleanup_script |
  echo "開始清理系統資源..."
  # 清理 Docker 資源
  docker system prune -af --volumes || true
  docker builder prune -af || true
  docker buildx prune -af || true
  # 清理系統快取
  rm -rf /tmp/* || true
  rm -rf /var/lib/apt/lists/* || true
  rm -rf /var/cache/apt/archives/* || true
  rm -rf /root/.cache/* || true
  # 清理 Go 快取
  if command -v go >/dev/null 2>&1; then
    rm -rf $(go env GOCACHE) || true
    rm -rf $(go env GOMODCACHE) || true
    go clean -cache -testcache -modcache || true
  fi
  # 強制清理剩餘空間
  find /var/log -type f -name "*.log" -delete || true
  find /tmp -type f -mtime +1 -delete || true
  df -h
  echo "清理完成"

variables:
  AWS_REGION: "ap-northeast-1"
  ECR_REGISTRY: "637423324672.dkr.ecr.${AWS_REGION}.amazonaws.com"
  ECR_REPO: "${ECR_REGISTRY}/quantumcat"
# Golang-lint 檢查
lint:
  stage: lint
  image: golangci/golangci-lint:latest
  before_script:
    - df -h
    - apt-get update && apt-get clean
    - apt-get install -y docker.io && apt-get clean
    - *cleanup_script
    - df -h
  script:
    - golangci-lint run
  after_script:
    - *cleanup_script
  only:
    - dev
    - merge_requests
# 單元測試
unit-tests:
  stage: test
  image: golang:1.24
  before_script:
    - df -h
    - apt-get update && apt-get clean
    - apt-get install -y docker.io && apt-get clean
    - *cleanup_script
    - df -h
  script:
    - go test -v ./internal/... || exit 1
    - go test -coverprofile=coverage.out ./internal/...
    - |
      if [ -f coverage.out ]; then
        coverage=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//' | awk '{print int($1)}')
        echo "測試覆蓋率：$coverage%"
      else
      echo "No coverage report generated"
      exit 1
      fi
  after_script:
    - rm -f coverage.out || true
    - *cleanup_script
  only:
    - dev
# 建構 Docker 映像
build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - apk add --no-cache aws-cli jq      # 安裝 AWS CLI
    - aws sts get-caller-identity        # 檢查當前身份
    # 登入 AWS ECR
    - |
      echo "Assuming role for ECR access..."
      creds=$(aws sts assume-role \
                --role-arn arn:aws:iam::637423324672:role/FatcatInternalRunnerAssumeRole \
                --role-session-name "ciBuild-${CI_PIPELINE_ID}" \
                --output json)
      if [ $? -ne 0 ]; then
        echo "Failed to assume role"
        exit 1
      fi
      export AWS_ACCESS_KEY_ID=$(echo "$creds" | jq -r '.Credentials.AccessKeyId')
      export AWS_SECRET_ACCESS_KEY=$(echo "$creds" | jq -r '.Credentials.SecretAccessKey')
      export AWS_SESSION_TOKEN=$(echo "$creds" | jq -r '.Credentials.SessionToken')
      echo "Successfully assumed role, verifying identity..."
      aws sts get-caller-identity --query 'Arn' --output text
    # Docker login
    - |
      echo "Logging into ECR..."
      aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

  script:
    - |
      # 設置 Docker Buildx 並限制快取大小
      docker buildx create --use --driver-opt env.BUILDKIT_STEP_LOG_MAX_SIZE=10485760
      docker buildx inspect --bootstrap

      # 輸出當前的 Git 信息，用於調試
      echo "Current commit SHA: ${CI_COMMIT_SHA}"
      echo "Current tag: ${CI_COMMIT_TAG}"
      
      # 檢查是否有 tag（使用 git 命令作為備選方案）
      GIT_TAG=$(git describe --tags --exact-match 2>/dev/null || echo "")
      echo "Git tag from command: ${GIT_TAG}"

      
      
      # 構建基本標籤列表
      TAGS="-t ${ECR_REPO}/fatnotificationcat:latest -t ${ECR_REPO}/fatnotificationcat:${CI_COMMIT_SHA}"

      # 優先使用 CI_COMMIT_TAG，如果沒有則使用 git command 獲取的 tag
      if [ -n "${CI_COMMIT_TAG}" ]; then
        echo "使用 CI_COMMIT_TAG: ${CI_COMMIT_TAG}"
        TAGS="$TAGS -t ${ECR_REPO}/fatnotificationcat:${CI_COMMIT_TAG}"
      elif [ -n "${GIT_TAG}" ]; then
        echo "使用 Git command tag: ${GIT_TAG}"
        TAGS="$TAGS -t ${ECR_REPO}/fatnotificationcat:${GIT_TAG}"
      fi


      # 執行構建和推送（限制快取大小）
      docker buildx build --push \
        --platform linux/amd64 \
        --build-arg TARGETOS=linux \
        --build-arg TARGETARCH=amd64 \
        --build-arg CI_COMMIT_SHA=${CI_COMMIT_SHA} \
        --cache-from type=gha \
        --cache-to type=gha,mode=min \
        ${TAGS} \
        .
  after_script:
    - |
      # 清理 Docker buildx 實例和快取
      docker buildx ls || true
      docker buildx rm --all-inactive || true
      docker buildx prune -af || true
    - *cleanup_script
  only:
    - dev



