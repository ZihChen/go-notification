include:
  - component: gitlab.jvdtech.dev/fatcat/infracat/ai-review@main

default:
  image: golang:1.25-alpine
  tags:
    - docker-executor
  cache:
    key:
      files:
        - go.sum
      prefix: "${CI_JOB_IMAGE}-${CI_RUNNER_EXECUTABLE_ARCH}"
    paths:
      - /go/pkg/mod
    policy: pull
    when: always

stages:
  - ai-review
  - lint
  - test
  - build
  - deploy

# ============================================
# Templates
# ============================================
.build-quantumcat-template:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  variables:
    AWS_REGION: ap-northeast-1
    ECR_REGISTRY: 637423324672.dkr.ecr.ap-northeast-1.amazonaws.com
    ECR_REPOSITORY: 637423324672.dkr.ecr.ap-northeast-1.amazonaws.com/quantumcat/fatnotificationcat
  before_script:
    - mkdir -p /kaniko/.docker
    # Download aws-cli v2 self-contained binary (no Python needed)
    - wget -q "https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip" -O /tmp/awscliv2.zip
    - unzip -q /tmp/awscliv2.zip -d /tmp
    - export AWSCLI=/tmp/aws/dist/aws
    # Assume FatcatInternalRunnerAssumeRole to get ECR push permissions
    - |
      CREDS=$($AWSCLI sts assume-role \
        --role-arn "arn:aws:iam::637423324672:role/FatcatInternalRunnerAssumeRole" \
        --role-session-name "ciBuild-${CI_PIPELINE_ID}" \
        --query "Credentials.[AccessKeyId,SecretAccessKey,SessionToken]" \
        --output text)
      export AWS_ACCESS_KEY_ID=$(echo "$CREDS" | awk '{print $1}')
      export AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | awk '{print $2}')
      export AWS_SESSION_TOKEN=$(echo "$CREDS" | awk '{print $3}')
      $AWSCLI sts get-caller-identity --query 'Arn' --output text
    # Write docker config for kaniko with ECR auth token
    - |
      ECR_PASSWORD=$($AWSCLI ecr get-login-password --region "${AWS_REGION}")
      AUTH=$(printf "AWS:%s" "${ECR_PASSWORD}" | base64 | tr -d '\n')
      printf '{"auths":{"%s":{"auth":"%s"}}}' "${ECR_REGISTRY}" "${AUTH}" > /kaniko/.docker/config.json
  script:
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile" \
        --destination "${ECR_REPOSITORY}:${IMAGE_TAG}" \
        --build-arg APP_VERSION=${CI_COMMIT_SHORT_SHA} \
        --build-arg CI_COMMIT_SHA=${CI_COMMIT_SHA} \
        --custom-platform=linux/amd64

.deploy-template:
  stage: deploy
  image: alpine:latest
  variables:
    AWS_REGION: ap-northeast-1
    EKS_CLUSTER_NAME: quantumcat-dev-001
  before_script:
    - apk add --no-cache aws-cli kubectl
    - aws eks update-kubeconfig --name ${EKS_CLUSTER_NAME} --region ${AWS_REGION}
    - aws sts get-caller-identity
  script:
    - kubectl rollout restart deployment/${DEPLOY_NAME}-web -n ${NAMESPACE}
    - kubectl rollout restart deployment/${DEPLOY_NAME}-sse -n ${NAMESPACE}
    - kubectl rollout restart deployment/${DEPLOY_NAME}-worker -n ${NAMESPACE}
    - kubectl rollout restart deployment/${DEPLOY_NAME}-scheduler -n ${NAMESPACE}
    - kubectl rollout restart deployment/${DEPLOY_NAME}-consumer -n ${NAMESPACE}

# ============================================
# Lint & Build Check
# ============================================
lint-and-build:
  tags:
    - macmini-designer
  stage: lint
  timeout: 15 minutes
  variables:
    GOPATH: ${CI_PROJECT_DIR}/.cache/go
    GOCACHE: ${CI_PROJECT_DIR}/.cache/go-build
    GOBIN: ${CI_PROJECT_DIR}/.cache/go/bin
  cache:
    - key:
        files:
          - go.sum
        prefix: "lint-${CI_JOB_IMAGE}-${CI_RUNNER_EXECUTABLE_ARCH}"
      paths:
        - .cache/go/pkg/mod
      policy: pull-push
      when: always
    - key: "lint-tools-${CI_JOB_IMAGE}-${CI_RUNNER_EXECUTABLE_ARCH}"
      paths:
        - .cache/go/bin
      policy: pull-push
      when: always
  before_script:
    - apk add --no-cache git
    - export PATH="${GOBIN}:${PATH}"
    - command -v golangci-lint || go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0
  script:
    - golangci-lint run ./...
    - go build ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev"

# ============================================
# Test
# ============================================
go-test:
  tags:
    - macmini-designer
  stage: test
  timeout: 20 minutes
  variables:
    GOPATH: ${CI_PROJECT_DIR}/.cache/go
    GOCACHE: ${CI_PROJECT_DIR}/.cache/go-build
    GOBIN: ${CI_PROJECT_DIR}/.cache/go/bin
  cache:
    - key:
        files:
          - go.sum
        prefix: "test-${CI_JOB_IMAGE}-${CI_RUNNER_EXECUTABLE_ARCH}"
      paths:
        - .cache/go/pkg/mod
        - .cache/go-build
      policy: pull-push
      when: always
  before_script:
    - apk add --no-cache gcc musl-dev
  script:
    - CGO_ENABLED=1 go test -race -timeout 300s -coverprofile=coverage.out ./internal/...
    - go tool cover -func=coverage.out
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev"

# ============================================
# Build
# ============================================
build-dev:
  extends: .build-quantumcat-template
  variables:
    IMAGE_TAG: dev
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

build-latest:
  extends: .build-quantumcat-template
  variables:
    IMAGE_TAG: latest
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

build-tag:
  extends: .build-quantumcat-template
  variables:
    IMAGE_TAG: ${CI_COMMIT_TAG}
  rules:
    - if: $CI_COMMIT_TAG

build-commit-sha:
  extends: .build-quantumcat-template
  variables:
    IMAGE_TAG: ${CI_COMMIT_SHA}
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

# ============================================
# Deploy
# ============================================
deploy-fatcat-dev:
  extends: .deploy-template
  variables:
    DEPLOY_NAME: fatcat-dev-notification-cat
    NAMESPACE: fatcat
  needs:
    - build-dev
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
