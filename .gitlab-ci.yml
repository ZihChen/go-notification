include:
  - component: gitlab.jvdtech.dev/fatcat/infracat/ai-review@main

default:
  image: golang:1.25-alpine
  tags:
    - docker-executor
  cache:
    key:
      files:
        - go.sum
      prefix: "${CI_JOB_IMAGE}-${CI_RUNNER_EXECUTABLE_ARCH}"
    paths:
      - /go/pkg/mod
    policy: pull-push
    when: always

stages:
  - ai-review
  - lint
  - test
  - build
  - deploy

# ============================================
# Templates
# ============================================
.build-template:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]

.build-quantumcat-template:
  extends: .build-template
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"credsStore\":\"ecr-login\"}" > /kaniko/.docker/config.json
    - chmod 600 /kaniko/.docker/config.json
  variables:
    ECR_REPOSITORY: 637423324672.dkr.ecr.ap-northeast-1.amazonaws.com/quantumcat/fatnotificationcat
  script:
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile" \
        --destination "${ECR_REPOSITORY}:${IMAGE_TAG}" \
        --build-arg APP_VERSION=${CI_COMMIT_SHORT_SHA} \
        --build-arg CI_COMMIT_SHA=${CI_COMMIT_SHA} \
        --custom-platform=linux/amd64

.deploy-template:
  stage: deploy
  image: alpine:latest
  variables:
    AWS_REGION: ap-northeast-1
    EKS_CLUSTER_NAME: quantumcat-dev-001
  before_script:
    - apk add --no-cache aws-cli kubectl
    - aws eks update-kubeconfig --name ${EKS_CLUSTER_NAME} --region ${AWS_REGION}
    - aws sts get-caller-identity
  script:
    - kubectl rollout restart deployment/${DEPLOY_NAME}-web -n ${NAMESPACE}
    - kubectl rollout restart deployment/${DEPLOY_NAME}-worker -n ${NAMESPACE}
    - kubectl rollout restart deployment/${DEPLOY_NAME}-scheduler -n ${NAMESPACE}
    - kubectl rollout restart deployment/${DEPLOY_NAME}-consumer -n ${NAMESPACE}

# ============================================
# Lint & Build Check
# ============================================
lint-and-build:
  tags:
    - macmini-designer
  stage: lint
  before_script:
    - apk add --no-cache git
    - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
  script:
    - golangci-lint run ./...
    - go build ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev"

# ============================================
# Test
# ============================================
go-test:
  tags:
    - macmini-designer
  stage: test
  before_script:
    - apk add --no-cache gcc musl-dev
  script:
    - CGO_ENABLED=1 go test -v -race -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.out
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev"

# ============================================
# Build
# ============================================
build-dev:
  extends: .build-quantumcat-template
  variables:
    IMAGE_TAG: dev
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

build-latest:
  extends: .build-quantumcat-template
  variables:
    IMAGE_TAG: latest
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

build-tag:
  extends: .build-quantumcat-template
  variables:
    IMAGE_TAG: ${CI_COMMIT_TAG}
  rules:
    - if: $CI_COMMIT_TAG

build-commit-sha:
  extends: .build-quantumcat-template
  variables:
    IMAGE_TAG: ${CI_COMMIT_SHA}
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

# ============================================
# Deploy
# ============================================
deploy-fatcat-dev:
  extends: .deploy-template
  variables:
    DEPLOY_NAME: fatcat-dev-notification-cat
    NAMESPACE: fatcat
  needs:
    - build-dev
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
